document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

);}\nbutton{-webkit-tap-highlight-color:transparent;}\ninput::placeholder,textarea::placeholder{color:oklch(0.48 0.01 260);}\ninput[type=time],input[type=date]{color-scheme:dark;}\n@media print{body{background:#fff !important;}#vt-app{display:none !important;}#vt-print{display:block !important;}@page{margin:16mm;}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div id=\"vt-app\" style=\"min-height:100vh;background:oklch(0.15 0.006 260);color:oklch(0.95 0.005 260);font-family:'Bricolage Grotesque',system-ui,sans-serif;\">\n  <div style=\"max-width:600px;margin:0 auto;padding:14px 16px 110px;display:flex;flex-direction:column;gap:16px;\">\n    <input type=\"file\" accept=\"image/*\" multiple=\"\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onFiles }}\" style=\"display:none;\">\n    <header style=\"display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:oklch(0.19 0.008 260);border:1px solid oklch(0.26 0.01 260);\">\n      <span style=\"width:40px;height:40px;flex:none;border-radius:11px;background:oklch(0.8 0.11 240);color:oklch(0.2 0.04 240);display:flex;align-items:center;justify-content:center;font:700 13px 'IBM Plex Mono',monospace;\">{{ headBadge }}<\u002Fspan>\n      <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;\">\n        <span style=\"font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ headTitle }}<\u002Fspan>\n        <span style=\"font-size:12px;color:oklch(0.66 0.01 260);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ headSub }}<\u002Fspan>\n      <\u002Fspan>\n      <span style=\"font-size:10.5px;font-weight:700;letter-spacing:0.06em;padding:4px 8px;border-radius:99px;border:1px solid oklch(0.34 0.05 240);color:oklch(0.82 0.08 240);\">{{ saveBadge }}<\u002Fspan>\n    <\u002Fheader>\n\n    <sc-if value=\"{{ isDados }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-screen-label=\"Visita\" style=\"display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"padding:16px;border-radius:20px;background:oklch(0.19 0.008 260);display:flex;flex-direction:column;gap:12px;\">\n          <span style=\"font-size:15px;font-weight:800;\">Obra<\u002Fspan>\n          <sc-for list=\"{{ infoFields }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12px;color:oklch(0.68 0.01 260);\">{{ f.label }}\n              <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onInput }}\" placeholder=\"{{ f.ph }}\" style=\"min-height:46px;box-sizing:border-box;padding:0 12px;border-radius:12px;border:1px solid oklch(0.3 0.01 260);background:oklch(0.15 0.006 260);color:oklch(0.95 0.005 260);font:600 15px 'Bricolage Grotesque',sans-serif;outline:none;width:100%;\">\n            <\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"padding:16px;border-radius:20px;background:oklch(0.19 0.008 260);display:flex;flex-direction:column;gap:12px;\">\n          <span style=\"font-size:15px;font-weight:800;\">Visita<\u002Fspan>\n          <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12px;color:oklch(0.68 0.01 260);\">Data\n            <input type=\"date\" value=\"{{ data }}\" sc-camel-on-change=\"{{ onData }}\" style=\"min-height:46px;box-sizing:border-box;padding:0 12px;border-radius:12px;border:1px solid oklch(0.3 0.01 260);background:oklch(0.15 0.006 260);color:oklch(0.95 0.005 260);font:600 15px 'IBM Plex Mono',monospace;outline:none;width:100%;\">\n          <\u002Flabel>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;\">\n            <sc-for list=\"{{ horas }}\" as=\"h\" hint-placeholder-count=\"2\">\n              <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12px;color:oklch(0.68 0.01 260);min-width:0;\">{{ h.label }}\n                <span style=\"display:flex;gap:4px;\">\n                  <input type=\"time\" value=\"{{ h.value }}\" sc-camel-on-change=\"{{ h.onInput }}\" style=\"flex:1;min-width:0;min-height:46px;box-sizing:border-box;padding:0 8px;border-radius:12px;border:1px solid oklch(0.3 0.01 260);background:oklch(0.15 0.006 260);color:oklch(0.95 0.005 260);font:600 15px 'IBM Plex Mono',monospace;outline:none;\">\n                  <sc-if value=\"{{ h.showNow }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button sc-camel-on-click=\"{{ h.now }}\" style=\"min-height:46px;padding:0 10px;border-radius:12px;border:0;background:oklch(0.8 0.11 240);color:oklch(0.2 0.04 240);font:700 12px 'Bricolage Grotesque',sans-serif;cursor:pointer;\">Agora<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasPerm }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:13px;font-weight:600;color:oklch(0.82 0.08 240);\">{{ permLabel }}<\u002Fspan>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <span style=\"font-size:12px;color:oklch(0.68 0.01 260);\">Clima<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n              <sc-for list=\"{{ climas }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ c.go }}\" style=\"min-height:40px;padding:0 14px;border-radius:99px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font:600 13px 'Bricolage Grotesque',sans-serif;cursor:pointer;\">{{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:16px;border-radius:20px;background:oklch(0.19 0.008 260);display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"display:flex;flex-direction:column;gap:2px;\">\n            <span style=\"font-size:15px;font-weight:800;\">Serviços em execução<\u002Fspan>\n            <span style=\"font-size:12px;color:oklch(0.64 0.01 260);\">Toque no que estava sendo feito quando você chegou.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n            <sc-for list=\"{{ execChips }}\" as=\"c\" hint-placeholder-count=\"12\">\n              <button sc-camel-on-click=\"{{ c.go }}\" style=\"min-height:40px;padding:0 12px;border-radius:99px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font:600 13px 'Bricolage Grotesque',sans-serif;cursor:pointer;\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <textarea value=\"{{ execTxt }}\" sc-camel-on-change=\"{{ onExecTxt }}\" rows=\"3\" placeholder=\"Detalhes (ex: concretagem da laje do 2º pavimento, 4 pedreiros)\" style=\"width:100%;box-sizing:border-box;resize:vertical;padding:12px;border-radius:12px;border:1px solid oklch(0.3 0.01 260);background:oklch(0.15 0.006 260);color:oklch(0.95 0.005 260);font:500 15px/1.45 'Bricolage Grotesque',sans-serif;outline:none;\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goCheck }}\" style=\"min-height:52px;border-radius:14px;border:0;background:oklch(0.8 0.11 240);color:oklch(0.2 0.04 240);font:700 16px 'Bricolage Grotesque',sans-serif;cursor:pointer;\">Ir para o checklist →<\u002Fbutton>\n        <span style=\"font-size:12px;line-height:1.5;color:oklch(0.6 0.01 260);text-align:center;text-wrap:pretty;padding:0 8px;\">A visita é salva automaticamente neste celular. Veja ou exclua na aba Salvas.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCheck }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Checklist\" style=\"display:flex;flex-direction:column;gap:14px;\">\n        <sc-for list=\"{{ selEtapas }}\" as=\"et\" hint-placeholder-count=\"1\">\n          <div style=\"border-radius:20px;background:oklch(0.19 0.008 260);border:1px solid {{ et.border }};displa GISTRO FOTOGRÁFICO<\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;\">\n              <sc-for list=\"{{ repPhotos }}\" as=\"p\" hint-placeholder-count=\"0\">\n                <div style=\"display:flex;flex-direction:column;gap:4px;\">\n                  <img src=\"{{ p.url }}\" alt=\"{{ p.label }}\" style=\"width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;\">\n                  <span style=\"font-size:11.5px;line-height:1.35;color:oklch(0.3 0.01 260);text-wrap:pretty;\">{{ p.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;\">\n          <button sc-camel-on-click=\"{{ novaVisita }}\" style=\"min-height:50px;border-radius:14px;border:1px solid oklch(0.34 0.01 260);background:transparent;color:oklch(0.9 0.005 260);font:700 15px 'Bricolage Grotesque',sans-serif;cursor:pointer;\">+ Nova visita<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ excluirAtual }}\" style=\"min-height:50px;border-radius:14px;border:1px solid oklch(0.45 0.12 25);background:transparent;color:oklch(0.78 0.13 25);font:700 15px 'Bricolage Grotesque',sans-serif;cursor:pointer;\">Excluir visita<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSalvas }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Salvas\" style=\"display:flex;flex-direction:column;gap:12px;\">\n        <button sc-camel-on-click=\"{{ novaVisita }}\" style=\"min-height:52px;border-radius:14px;border:0;background:oklch(0.8 0.11 240);color:oklch(0.2 0.04 240);font:700 16px 'Bricolage Grotesque',sans-serif;cursor:pointer;\">+ Nova visita<\u002Fbutton>\n        <sc-if value=\"{{ noSalvas }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size:13px;color:oklch(0.66 0.01 260);text-align:center;padding:20px 8px;\">Nenhuma visita salva ainda.<\u002Fspan>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ salvas }}\" as=\"sv\" hint-placeholder-count=\"3\">\n          <div style=\"padding:14px;border-radius:16px;background:oklch(0.19 0.008 260);border:1px solid {{ sv.border }};display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"display:flex;flex-direction:column;gap:3px;\">\n              <span style=\"font-size:15.5px;font-weight:800;line-height:1.3;\">{{ sv.title }}<\u002Fspan>\n              <span style=\"font-size:12.5px;color:oklch(0.68 0.01 260);\">{{ sv.sub }}<\u002Fspan>\n              <span style=\"font-size:12.5px;color:{{ sv.ncColor }};\">{{ sv.info }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;\">\n              <button sc-camel-on-click=\"{{ sv.open }}\" style=\"min-height:44px;border-radius:12px;border:1px solid {{ sv.openBorder }};background:{{ sv.openBg }};color:{{ sv.openFg }};font:700 14px 'Bricolage Grotesque',sans-serif;cursor:pointer;\">{{ sv.openLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ sv.del }}\" style=\"min-height:44px;border-radius:12px;border:1px solid oklch(0.45 0.12 25);background:transparent;color:oklch(0.78 0.13 25);font:700 14px 'Bricolage Grotesque',sans-serif;cursor:pointer;\">Excluir<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <span style=\"font-size:12px;line-height:1.5;color:oklch(0.6 0.01 260);text-align:center;text-wrap:pretty;padding:0 8px;\">As visitas ficam salvas só neste aparelho. Excluir apaga a visita de vez.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <nav style=\"position:fixed;left:0;right:0;bottom:0;z-index:5;background:oklch(0.17 0.007 260);border-top:1px solid oklch(0.25 0.01 260);padding:8px 12px calc(8px + env(safe-area-inset-bottom));\">\n    <div style=\"max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ t.go }}\" style=\"min-height:48px;border:0;border-radius:12px;background:{{ t.bg }};color:{{ t.fg }};font:700 13px 'Bricolage Grotesque',sans-serif;cursor:pointer;padding:0 2px;\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;padding:11px 16px;border-radius:14px;background:oklch(0.25 0.01 260);border:1px solid oklch(0.8 0.11 240);box-shadow:0 10px 30px oklch(0 0 0 / 0.5);font-size:14px;font-weight:700;max-width:calc(100vw - 32px);\">{{ toastText }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<div id=\"vt-print\" style=\"display:none;font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff;font-size:11pt;line-height:1.45;\">\n  <div style=\"font-size:17pt;font-weight:700;margin-bottom:8px;\">Relatório de visita técnica<\u002Fdiv>\n  <sc-for list=\"{{ repHead }}\" as=\"r\" hint-placeholder-count=\"0\">\n    <div><b>{{ r.k }}:<\u002Fb> {{ r.v }}<\u002Fdiv>\n  <\u002Fsc-for>\n  <sc-for list=\"{{ repSections }}\" as=\"sc\" hint-placeholder-count=\"0\">\n    <div style=\"margin-top:14px;\">\n      <div style=\"font-size:11.5pt;font-weight:700;border-bottom:1px solid #999;padding-bottom:2px;margin-bottom:6px;\">{{ sc.title }}<\u002Fdiv>\n      <sc-for list=\"{{ sc.lines }}\" as=\"ln\" hint-placeholder-count=\"0\">\n        <div style=\"padding-left:{{ ln.indent }};font-weight:{{ ln.weight }};color:{{ ln.printColor }};white-space:pre-wrap;break-inside:avoid;\">{{ ln.text }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <sc-if value=\"{{ hasRepPhotos }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:14px;\">\n      <div style=\"font-size:11.5pt;font-weight:700;border-bottom:1px solid #999;padding-bottom:2px;margin-bottom:8px;\">REGISTRO FOTOGRÁFICO<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\">\n        <sc-for list=\"{{ repPhotos }}\" as=\"p\" hint-placeholder-count=\"0\">\n          <div style=\"break-inside:avoid;display:flex;flex-direction:column;gap:3px;\">\n            <img src=\"{{ p.url }}\" alt=\"{{ p.label }}\" style=\"width:100%;height:62mm;object-fit:contain;background:#f2f2f2;display:block;\">\n            <div style=\"font-size:9pt;color:#333;\">{{ p.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"margin-top:40px;\">______________________________________<\u002Fdiv>\n  <div>{{ signLine }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SKEY = 'vistoria3-sessao', LKEY = 'visita-tecnica-salvas';\nconst newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);\nconst loadList = () => { try { const a = JSON.parse(localStorage.getItem(LKEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };\nconst ACC = 'oklch(0.8 0.11 240)', ONA = 'oklch(0.2 0.04 240)', OK = 'oklch(0.8 0.13 150)', NC = 'oklch(0.72 0.15 25)', PEN = 'oklch(0.32 0.01 260)';\nconst CLIMAS = ['Ensolarado', 'Nublado', 'Chuvoso', 'Choveu no período'];\nconst EXEC = ['Locação', 'Fundação', 'Fôrmas', 'Armação', 'Concretagem', 'Alvenaria', 'Laje', 'Cobertura', 'Instalação elétrica', 'Instalação hidráulica', 'Esgoto', 'Impermeabilização', 'Chapisco / reboco', 'Contrapiso', 'Revestimento cerâmico', 'Esquadrias', 'Pintura', 'Louças e metais', 'Limpeza', 'Obra parada'];\nconst pad = n => String(n).padStart(2, '0');\nconst todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };\nconst nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };\nconst brDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };\nconst toMin = t => t && /^\\d\\d:\\d\\d/.test(t) ? (+t.slice(0, 2)) * 60 + (+t.slice(3, 5)) : null;\nconst dur = m => `${Math.floor(m / 60)}h${pad(m % 60)}`;\nconst esc = s => String(s || '').replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;');\nconst pctColor = p => p === null ? 'oklch(0.7 0.01 260)' : p >= 100 ? OK : p >= 70 ? 'oklch(0.82 0.13 85)' : p > 0 ? 'oklch(0.85 0.005 260)' : 'oklch(0.7 0.01 260)';\nconst EMPTY = () => ({ info: { obra: '', cliente: '', endereco: '', resp: '' }, data: todayISO(), chegada: '', saida: '', clima: '', exec: [], execTxt: '', sel: [], marks: {}, ncTxt: '', orTxt: '' });\n\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    const list = loadList();\n    let v = null;\n    try { v = JSON.parse(sessionStorage.getItem(SKEY) || 'null'); } catch (e) {}\n    if (v && !v.id) v.id = newId();\n    if (v && !list.some(x => x.id === v.id) && !this.hasDataV(v)) v = null;\n    if (v) { const saved = list.find(x => x.id === v.id); if (saved) v = saved; }\n    this.state = { list, v: v || { ...EMPTY(), id: newId() }, view: 'dados', q: '', open: {}, gopen: {}, browser: false, incUnc: false, toast: '', photos: {} };\n    this.fileRef = React.createRef();\n  }\n  componentDidMount() {\n    if (!window.ETAPAS) this.poll = setInterval(() => { if (window.ETAPAS) { clearInterval(this.poll); this.forceUpdate(); } }, 100);\n\n  }\n  componentWillUnmount() { clearInterval(this.poll); clearTimeout(this.tt); }\n  hasDataV(v) { return !!(v.info.obra || v.info.cliente || v.sel.length || v.chegada || v.ncTxt.trim() || v.orTxt.trim() || v.execTxt.trim() || v.exec.length); }\n  persist() {\n    const v = this.state.v;\n    try { sessionStorage.setItem(SKEY, JSON.stringify(v)); } catch (e) {}\n    if (!this.hasDataV(v)) return;\n    const list = loadList().filter(x => x.id !== v.id);\n    list.unshift({ ...v, updated: Date.now() });\n    try { localStorage.setItem(LKEY, JSON.stringify(list)); } catch (e) { this.toast('Memória cheia: exclua visitas antigas'); }\n    this.setState({ list });\n  }\n  openVisit(id) { const x = loadList().find(y => y.id === id); if (!x) return; this.setState({ v: x, photos: {}, view: 'dados', open: {}, gopen: {}, browser: false, q: '' }, () => { try { sessionStorage.setItem(SKEY, JSON.stringify(x)); } catch (e) {} }); this.toast('Visita aberta'); }\n  deleteVisit(id) {\n    const list = loadList().filter(y => y.id !== id);\n    try { localStorage.setItem(LKEY, JSON.stringify(list)); } catch (e) {}\n    const patch = { list };\n    if (this.state.v.id === id) { patch.v = { ...EMPTY(), id: newId() }; patch.photos = {}; patch.open = {}; patch.gopen = {}; patch.browser = false; try { sessionStorage.removeItem(SKEY); } catch (e) {} }\n    this.setState(patch); this.toast('Visita excluída');\n  }\n  newVisit() { const v = { ...EMPTY(), id: newId() }; try { sessionStorage.setItem(SKEY, JSON.stringify(v)); } catch (e) {} this.setState({ v, photos: {}, view: 'dados', open: {}, gopen: {}, browser: false, q: '' }); }\n  hasData() { const v = this.state.v; return !!(Object.keys(this.state.photos).some(k => this.state.photos[k].length) || v.info.obra || v.sel.length || v.chegada || v.ncTxt || v.orTxt || v.execTxt); }\n  set(patch) { this.setState(s => ({ v: { ...s.v, ...(typeof patch === 'function' ? patch(s.v) : patch) } }), () => this.persist()); }\n  pickPhoto(target) { this.photoTarget = target; const el = this.fileRef.current; if (el) { el.value = ''; el.click(); } }\n  compress(file) {\n    return new Promise((res, rej) => {\n      const u = URL.createObjectURL(file), img = new Image();\n      img.onload = () => { const sc = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc); c.
